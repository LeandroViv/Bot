name: Fine-Tuning Gratis en Colab

on:
  schedule:
    - cron: '0 4 * * 0' # Cada domingo a las 4:00 AM UTC
  workflow_dispatch:

jobs:
  run-colab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar cliente de ejecución
        run: |
          pip install papermill ipykernel huggingface_hub

      - name: Exportar el último Dataset a Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          python exportar_dataset.py

      - name: Ejecutar Fine-Tuning
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO }}
          HF_MODEL_OUTPUT: ${{ secrets.HF_MODEL_OUTPUT }}
        run: |
          papermill finetune_unsloth.ipynb output_run.ipynb
