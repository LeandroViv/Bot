name: Automático Fine-Tuning Cloud

on:
  schedule:
    # Se ejecuta todos los domingos a las 03:00 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite dispararlo manualmente desde la pestaña Actions en GitHub

jobs:
  finetune:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install together requests

      - name: Exportar Dataset actualizado
        run: |
          python exportar_dataset.py

      - name: Enviar a Fine-Tuning en la nube
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          python lanzar_finetuning.py
