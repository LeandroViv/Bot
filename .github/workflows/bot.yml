name: Leandro Bot 24/7

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (FFmpeg y Tauri deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget file libasound2-dev libpulse-dev

      - name: Instalar Rust, Bun y Just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

          export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"
          cargo install just

      - name: Clonar y compilar Voicebox desde el código fuente
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"
          git clone https://github.com/jamiepine/voicebox.git
          cd voicebox
          just setup
          just build

      - name: Instalar Ollama y descargar modelo
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 5
          ollama pull llama3.2

      - name: Instalar y limpiar librerías de Python
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y google-generativeai google-ai-generativelanguage || true
          pip install requests beautifulsoup4 python-telegram-bot ddgs huggingface_hub openai-whisper soundfile gtts faster-whisper google-genai transformers==4.38.2 TTS

      - name: Ejecutar el Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COQUI_TOS_AGREED: "1"
        run: |
          python procesar.py
