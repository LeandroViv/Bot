name: Leandro Bot 24/7

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg y dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Ollama y descargar modelo local
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 5
          ollama pull llama3.2

      - name: Instalar dependencias de Python y Clonador Liviano
        run: |
          python -m pip install --upgrade pip
          pip install requests python-telegram-bot faster-whisper google-genai soundfile torch transformers scipy

      - name: Ejecutar el Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_HOST: "http://127.0.0.1:11434"
        run: |
          python procesar.py
