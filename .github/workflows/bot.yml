name: Leandro Bot 24/7 Continuo

on:
  workflow_dispatch:
  repository_dispatch:
    types: [reenganche-bot]

jobs:
  procesar-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests duckduckgo_search beautifulsoup4

      - name: Instalar e Iniciar Ollama en el Runner
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Ejecutar Bot en Bucle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python bot.py

      - name: Persistir memoria local en el repositorio
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historial.json || true
          git commit -m "update: persistencia de memoria local" || true
          git push || true
