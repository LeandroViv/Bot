name: Leandro Bot 24/7 Continuo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Cancela ejecuciones viejas para evitar conflictos de múltiples bots
concurrency:
  group: bot-telegram-session
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Ollama
        run: |
          sudo apt-get update
          sudo apt-get install -y curl build-essential
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Iniciar servidor Ollama, descargar y precalentar Llama 3.2
        run: |
          ollama serve &
          echo "Esperando que Ollama inicie..."
          sleep 8
          ollama pull llama3.2
          echo "🔥 Precalentando modelo en memoria..."
          curl http://127.0.0.1:11434/api/generate -d '{"model": "llama3.2", "prompt": "hola", "stream": false}'

      - name: Instalar requerimientos de Python (usando paquete actualizado ddgs)
        run: |
          pip install --upgrade pip
          pip install python-telegram-bot requests beautifulsoup4 ddgs

      - name: Sincronizar memoria e iniciar Bot 24/7 (Reconexión cada 5h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Bucle que reinicia el proceso cada 5 horas (18000s) para renovar el runner
          while true; do
            echo "🚀 Lanzando Leandro Bot (Ciclo de 5 horas)..."
            timeout 18000 python procesar.py
            echo "🔄 Pasaron 5 horas o el script se detuvo. Reiniciando en 5 segundos..."
            sleep 5
          done
