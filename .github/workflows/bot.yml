name: Bot Telegram Leandro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias del sistema (FFmpeg, libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 rubberband-cli

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # --- CONFIGURACIÓN Y SERVICIO DE OLLAMA LOCAL ---
      - name: Configurar Ollama CLI
        uses: ai-action/setup-ollama@v2

      - name: Iniciar servidor Ollama y descargar modelo llama3.2
        run: |
          ollama serve &
          echo "Esperando a que Ollama esté listo..."
          sleep 5
          ollama pull llama3.2
        shell: bash

      # --- LEVANTAR OPEN WEBUI CON BÚSQUEDA WEB EN EL RUNNER ---
      - name: Levantar Open WebUI en la nube del Runner
        run: |
          docker run -d -p 8080:8080 \
            -e OLLAMA_BASE_URL=http://127.0.0.1:11434 \
            -e ENABLE_WEB_SEARCH=true \
            -e WEB_SEARCH_ENGINE=duckduckgo \
            -e WEB_SEARCH_RESULT_COUNT=3 \
            --name open-webui \
            --restart always \
            ghcr.io/open-webui/open-webui:main
          echo "Esperando que Open WebUI caliente motores en el puerto 8080..."
          sleep 12

      # --- EJECUCIÓN PRINCIPAL DE LEANDROBOT ---
      - name: Ejecutar Bot de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_BOT_TOKEN: ${{ secrets.GH_PAT }}
          OLLAMA_HOST: "http://127.0.0.1:11434"
          OLLAMA_MODEL: "llama3.2"
          OPEN_WEBUI_API_URL: "http://127.0.0.1:8080/api/chat/completions"
        run: |
          python procesar.py
