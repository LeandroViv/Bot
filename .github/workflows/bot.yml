name: Leandro Bot 24/7

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg y Rubberband
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rubberband-cli

      - name: Instalar Ollama y descargar modelo
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 5
          ollama pull llama3.2

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests python-telegram-bot faster-whisper google-genai soundfile gtts

      - name: Configurar Git
        run: |
          git config --global user.name "Leandro Bot Action"
          git config --global user.email "bot@actions.github.com"

      - name: Ejecutar el Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python procesar.py
