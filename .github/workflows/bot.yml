name: Bot Telegram Vibe Coding

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias del sistema (FFmpeg y libopus)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libopus-dev

    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot[socks] faster-whisper gTTS google-genai requests

    - name: Ejecutar Bot Autónomo
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python procesar.py
