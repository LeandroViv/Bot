name: Leandro Bot 24/7

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Cancela ejecuciones viejas automáticamente al hacer git push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema (FFmpeg)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Ollama y descargar modelo
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 5
          ollama pull llama3.2

      - name: Instalar librerías de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-telegram-bot ddgs huggingface_hub openai-whisper soundfile gtts

      - name: Ejecutar el Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_DATASET_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python procesar.py
