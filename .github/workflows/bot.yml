name: Bot Telegram Leandro Ollama

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Auto-reinicio periódico para mantener el bot activo

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Máximo tiempo permitido por job en GitHub Actions

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 rubberband-cli git

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar Ollama CLI
        uses: ai-action/setup-ollama@v2

      - name: Iniciar servidor Ollama y descargar modelo
        run: |
          ollama serve &
          echo "Esperando a que Ollama esté listo..."
          sleep 5
          ollama pull phi3
        shell: bash

      - name: Configurar Git Global para Aider
        run: |
          git config --global user.name "LeandroBot[bot]"
          git config --global user.email "leandrobot@users.noreply.github.com"

      - name: Ejecutar Bot de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_BOT_TOKEN: ${{ secrets.GH_PAT }}
          OLLAMA_HOST: "http://127.0.0.1:11434"
          OLLAMA_MODEL: "phi3"
        run: |
          python procesar.py
