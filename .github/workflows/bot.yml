name: Leandro Bot 24/7 Continuo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Cancela automáticamente cualquier runner previo escuchando cuando se hace un push/commit nuevo
concurrency:
  group: bot-telegram-session
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Ollama
        run: |
          sudo apt-get update
          sudo apt-get install -y curl build-essential
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Iniciar servidor Ollama y descargar Llama 3.2
        run: |
          ollama serve &
          echo "Esperando que Ollama inicie..."
          sleep 8
          ollama pull llama3.2

      - name: Instalar requerimientos de Python
        run: |
          pip install --upgrade pip
          pip install python-telegram-bot requests beautifulsoup4 duckduckgo_search

      - name: Sincronizar memoria e iniciar Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python procesar.py
