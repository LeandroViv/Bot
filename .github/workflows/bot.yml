name: Ejecutar LeandroBot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Dependencias
        run: pip install -r requirements.txt

      - name: Instalar y Levantar Ollama en Background
        run: |
          echo "📥 Instalando Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          
          echo "🚀 Lanzando servidor Ollama con nohup..."
          nohup ollama serve > ollama.log 2>&1 &
          
          echo "⏳ Esperando a que Ollama levante el puerto 11434..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "✅ ¡Ollama está activo y respondiendo!"
              break
            fi
            sleep 2
          done

          echo "📥 Descargando modelo llama3.2..."
          ollama pull llama3.2

      - name: Correr LeandroBot con Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOZ_ESTILO: ${{ secrets.VOZ_ESTILO }}
          OLLAMA_HOST: "http://127.0.0.1:11434"
        run: python procesar.py
