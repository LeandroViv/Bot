name: Bot Telegram Leandro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema (FFmpeg, libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 rubberband-cli git

      - name: Instalar dependencias de Python y Open WebUI
        run: |
          pip install --upgrade pip
          pip install open-webui
          pip install -r requirements.txt

      # --- OLLAMA LOCAL EN RUNNER (MOTOR Y CHARLA) ---
      - name: Configurar Ollama CLI
        uses: ai-action/setup-ollama@v2

      - name: Iniciar servidor Ollama y descargar modelo llama3.2
        run: |
          ollama serve &
          echo "Esperando a que Ollama esté listo..."
          sleep 5
          ollama pull llama3.2
        shell: bash

      # --- LEVANTAR OPEN WEBUI NATIVO SIN AUTENTICACIÓN LOCAL ---
      - name: Iniciar Open WebUI Serve
        run: |
          export WEBUI_AUTH=False
          open-webui serve &
          echo "Esperando que Open WebUI esté listo en el puerto 8080..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080/ > /dev/null; then
              echo "✅ Open WebUI está respondiendo nativamente!"
              break
            fi
            echo "Reintentando conexión con Open WebUI ($i/30)..."
            sleep 3
          done

      # --- EJECUCIÓN PRINCIPAL DE LEANDROBOT ---
      - name: Ejecutar Bot de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_BOT_TOKEN: ${{ secrets.GH_PAT }}
          OLLAMA_HOST: "http://127.0.0.1:11434"
          OLLAMA_MODEL: "llama3.2"
          OPEN_WEBUI_API_URL: "http://127.0.0.1:8080/api/chat/completions"
          WEBUI_AUTH: "False"
        run: |
          python procesar.py
