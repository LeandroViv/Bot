name: Bot Telegram Leandro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias del sistema (FFmpeg, libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 rubberband-cli

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # --- OLLAMA LOCAL EN RUNNER (CHARLA COMÚN) ---
      - name: Configurar Ollama CLI
        uses: ai-action/setup-ollama@v2

      - name: Iniciar servidor Ollama y descargar modelo llama3.2
        run: |
          ollama serve &
          echo "Esperando a que Ollama esté listo..."
          sleep 5
          ollama pull llama3.2
        shell: bash

      # --- BOLT.DIY APP BUILDER CON BÚSQUEDA WEB (CODING) ---
      - name: Levantar Bolt.diy App Builder
        run: |
          docker run -d \
            --network host \
            -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            -e ENABLE_WEB_SEARCH=true \
            -e PORT=5173 \
            --name bolt-diy \
            --restart always \
            ghcr.io/stackblitz-labs/bolt.diy:main || true

          echo "Esperando que Bolt.diy inicialice en la red del runner..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:5173/ > /dev/null; then
              echo "✅ Bolt.diy está respondiendo en el puerto 5173!"
              break
            fi
            echo "Reintentando conexión con Bolt.diy ($i/15)..."
            sleep 3
          done

      # --- EJECUCIÓN PRINCIPAL DE LEANDROBOT ---
      - name: Ejecutar Bot de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_BOT_TOKEN: ${{ secrets.GH_PAT }}
          OLLAMA_HOST: "http://127.0.0.1:11434"
          OLLAMA_MODEL: "llama3.2"
          BOLT_API_URL: "http://127.0.0.1:5173/api/build"
        run: |
          python procesar.py
